services:
  endguinfield:
    container_name: endguinfield
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # replace env here
    expose:
      - "8080"
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
